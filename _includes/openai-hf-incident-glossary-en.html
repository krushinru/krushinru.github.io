<div class="incident-glossary js-incident-glossary" hidden>
  <div class="incident-glossary__backdrop js-glossary-close" aria-hidden="true"></div>
  <aside
    class="incident-glossary__panel"
    id="incident-glossary-panel"
    role="dialog"
    aria-modal="true"
    aria-labelledby="incident-glossary-title"
    aria-describedby="incident-glossary-body"
    tabindex="-1">
    <div class="incident-glossary__topline">
      <button class="incident-glossary__close js-glossary-close" type="button" aria-label="Close explanation">Close ×</button>
    </div>
    <h2 id="incident-glossary-title"></h2>
    <div class="incident-glossary__body" id="incident-glossary-body"></div>
  </aside>

  <template data-glossary-term="agent" data-title="AI agent">
    <p>A program built around a language model. An agent receives a goal, chooses a sequence of actions, runs commands, reads files, and checks the result.</p>
  </template>

  <template data-glossary-term="hf" data-title="Hugging Face">
    <p>A platform where developers publish machine-learning models, datasets, and applications.</p>
  </template>

  <template data-glossary-term="model" data-title="Model">
    <p>A trained mathematical system that continues text, writes code, or performs other tasks. A single agent can use several models.</p>
  </template>

  <template data-glossary-term="sandbox" data-title="Sandbox">
    <p>An isolated virtual computer. It can run suspicious code without giving that code direct access to the rest of the network.</p>
  </template>

  <template data-glossary-term="exploit" data-title="Exploit">
    <p>A program or set of commands that uses a specific vulnerability to enter a system or take an unauthorized action.</p>
  </template>

  <template data-glossary-term="token" data-title="Access token">
    <p>A digital key that proves a program is allowed to connect to a service and perform specific actions.</p>
  </template>

  <template data-glossary-term="repository" data-title="Repository">
    <p>A store of source code and its change history. A private repository is available only to employees and other authorized users.</p>
  </template>

  <template data-glossary-term="open-weights" data-title="Open weights">
    <p>A trained model that can be downloaded and run on your own computers. Its source code and training data are not necessarily open.</p>
  </template>

  <template data-glossary-term="frontier" data-title="Frontier models">
    <p>The most capable AI models available at a given time. They are usually built by the largest labs and require especially large amounts of computing power to train.</p>
  </template>
</div>
